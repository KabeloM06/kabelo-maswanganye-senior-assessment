services:
  postgres:
    image: postgres:18
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - taskmanager-postgres-data:/var/lib/postgresql/data

volumes:
  taskmanager-postgres-data: